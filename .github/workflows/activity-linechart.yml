name: Update Activity Chart
on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/daily-linechart.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-activity-7days.svg
          git diff --staged --quiet || git commit -m "chore: update activity chart"
          git push
