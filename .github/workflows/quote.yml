name: Refresh Daily Quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Daily Quote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Update README
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import re

          try:
              url = "https://zenquotes.io/api/random"
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  quote = data[0]['q']
                  author = data[0]['a']
          except Exception as e:
              print(f"Error fetching quote: {e}")
              quote = "Keep pushing forward, every step matters."
              author = "System"

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'<!-- DAILY_QUOTE:START -->[\s\S]*?<!-- DAILY_QUOTE:END -->'
          
          formatted_text = f'🗯 Daily Quote :\n<center><font color="#0c7ec9">{quote}</font><br/>— <font color="#808080">{author}</font></center>'
          replacement = f'<!-- DAILY_QUOTE:START -->\n{formatted_text}\n<!-- DAILY_QUOTE:END -->'

          if re.search(pattern, content):
              new_content = re.sub(pattern, replacement, content)
          else:
              new_content = content + f'\n{replacement}\n'

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update daily quote" && git push)
