name: Refresh Daily Quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Daily Quote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Quote and Update README
        run: |
          QUOTE_TEXT=$(curl -s https://zenquotes.io/api/random | jq -r '.[0].q + " — " + .[0].a')
          echo "Quote fetched: $QUOTE_TEXT"
          
          python3 -c "
          import re
          
          quote = '''$QUOTE_TEXT'''
          with open('README.md', 'r') as f:
              content = f.read()
          
          pattern = r'<!-- DAILY_QUOTE:START -->[\s\S]*?<!-- DAILY_QUOTE:END -->'
          replacement = f'<!-- DAILY_QUOTE:START -->\n> \"{quote}\"\n<!-- DAILY_QUOTE:END -->'
          
          new_content = re.sub(pattern, replacement, content)
          
          with open('README.md', 'w') as f:
              f.write(new_content)
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: update daily quote" && git push)
