name: Update Language Stats SVG

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate language stats SVG
        env:
          GH_STAT: ${{ secrets.GH_STAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/language_stats.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-stats.svg
          git diff --cached --quiet || (git commit -m "Update language stats SVG" && git push)
