name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#ebedf0,#cff5fc,#99e5f7,#00aadd,#005f77
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#0d1117,#132d35,#0a4a5a,#00aadd,#33ddff

      - name: Commit and push to default branch
        run: |
          mkdir -p assets
          cp dist/*.svg assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || (git commit -m "chore: update snake animation" && git push)
