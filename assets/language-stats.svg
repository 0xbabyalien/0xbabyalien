<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <mask id="ring-mask">
      <circle cx="250" cy="250" r="160" fill="none" stroke="white" stroke-width="10" 
              stroke-dasharray="1005.3" stroke-dashoffset="1005.3" 
              style="animation: draw-ring 8.0s infinite;" />
    </mask>

    <style>
      .bg { fill: #0d1117; } 
      .ring {
        transform: rotate(-90deg);
        transform-origin: 250px 250px;
        stroke-linecap: round;
        mask: url(#ring-mask);
      }
      @keyframes draw-ring {
        0% { stroke-dashoffset: 1005.3; opacity: 1; }
        3% { stroke-dashoffset: 0; opacity: 1; }
        98% { stroke-dashoffset: 0; opacity: 1; }
        98.1%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .inner-pie {
        fill: transparent;
        stroke-width: 160; 
        transform-origin: 250px 250px;
        filter: url(#shadow);
      }
      .pie-text {
        font-family: sans-serif;
        font-size: 16px;
        font-weight: bold;
        text-anchor: middle;
        dominant-baseline: middle;
        opacity: 0;
      }
      
        @keyframes wipe-pie-0 {
            0%, 3.0% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
            3.1% { opacity: 1; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            8.0% { stroke-dasharray: 295.1 502.7; stroke-dashoffset: 0; opacity: 1; }
            15.0% { stroke-dasharray: 295.1 502.7; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            21.0% { stroke-dasharray: 0 502.7; stroke-dashoffset: -295.1; opacity: 1; }
            21.1%, 100% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
        }
        @keyframes text-fade-0 {
            0%, 5.0%, 21.0%, 100% { opacity: 0; }
            8.0%, 15.0% { opacity: 1; }
        }
        
        @keyframes wipe-pie-1 {
            0%, 20.0% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
            20.1% { opacity: 1; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            25.0% { stroke-dasharray: 97.9 502.7; stroke-dashoffset: 0; opacity: 1; }
            32.0% { stroke-dasharray: 97.9 502.7; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            38.0% { stroke-dasharray: 0 502.7; stroke-dashoffset: -97.9; opacity: 1; }
            38.1%, 100% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
        }
        @keyframes text-fade-1 {
            0%, 22.0%, 38.0%, 100% { opacity: 0; }
            25.0%, 32.0% { opacity: 1; }
        }
        
        @keyframes wipe-pie-2 {
            0%, 40.0% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
            40.1% { opacity: 1; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            45.0% { stroke-dasharray: 55.3 502.7; stroke-dashoffset: 0; opacity: 1; }
            52.0% { stroke-dasharray: 55.3 502.7; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            58.0% { stroke-dasharray: 0 502.7; stroke-dashoffset: -55.3; opacity: 1; }
            58.1%, 100% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
        }
        @keyframes text-fade-2 {
            0%, 42.0%, 58.0%, 100% { opacity: 0; }
            45.0%, 52.0% { opacity: 1; }
        }
        
        @keyframes wipe-pie-3 {
            0%, 60.0% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
            60.1% { opacity: 1; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            65.0% { stroke-dasharray: 27.8 502.7; stroke-dashoffset: 0; opacity: 1; }
            72.0% { stroke-dasharray: 27.8 502.7; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            78.0% { stroke-dasharray: 0 502.7; stroke-dashoffset: -27.8; opacity: 1; }
            78.1%, 100% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
        }
        @keyframes text-fade-3 {
            0%, 62.0%, 78.0%, 100% { opacity: 0; }
            65.0%, 72.0% { opacity: 1; }
        }
        
        @keyframes wipe-pie-4 {
            0%, 80.0% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
            80.1% { opacity: 1; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            85.0% { stroke-dasharray: 26.5 502.7; stroke-dashoffset: 0; opacity: 1; }
            92.0% { stroke-dasharray: 26.5 502.7; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            98.0% { stroke-dasharray: 0 502.7; stroke-dashoffset: -26.5; opacity: 1; }
            98.1%, 100% { opacity: 0; stroke-dasharray: 0 502.7; stroke-dashoffset: 0; }
        }
        @keyframes text-fade-4 {
            0%, 82.0%, 98.0%, 100% { opacity: 0; }
            85.0%, 92.0% { opacity: 1; }
        }
        
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="15" />

  <g id="chart-container">
    
        <g class="chart-item">
            <circle cx="250" cy="250" r="160" fill="transparent" stroke="#e34c26" 
                    stroke-width="4" stroke-dasharray="586.3 1005.3" 
                    stroke-dashoffset="-0.0" class="ring"/>
            <circle cx="250" cy="250" r="80" stroke="#e34c26" class="inner-pie" 
                    style="transform: rotate(-90.0deg); animation: wipe-pie-0 8.0s infinite;"/>
            <text x="346.3" y="277.0" class="pie-text" fill="#ffffff" 
                  style="animation: text-fade-0 8.0s infinite;">58.7%</text>
        </g>
        
        <g class="chart-item">
            <circle cx="250" cy="250" r="160" fill="transparent" stroke="#f1e05a" 
                    stroke-width="4" stroke-dasharray="191.7 1005.3" 
                    stroke-dashoffset="-590.3" class="ring"/>
            <circle cx="250" cy="250" r="80" stroke="#f1e05a" class="inner-pie" 
                    style="transform: rotate(121.4deg); animation: wipe-pie-1 8.0s infinite;"/>
            <text x="158.4" y="290.0" class="pie-text" fill="#ffffff" 
                  style="animation: text-fade-1 8.0s infinite;">19.5%</text>
        </g>
        
        <g class="chart-item">
            <circle cx="250" cy="250" r="160" fill="transparent" stroke="#a371f7" 
                    stroke-width="4" stroke-dasharray="106.6 1005.3" 
                    stroke-dashoffset="-786.0" class="ring"/>
            <circle cx="250" cy="250" r="80" stroke="#a371f7" class="inner-pie" 
                    style="transform: rotate(191.5deg); animation: wipe-pie-2 8.0s infinite;"/>
            <text x="164.5" y="198.1" class="pie-text" fill="#ffffff" 
                  style="animation: text-fade-2 8.0s infinite;">11.0%</text>
        </g>
        
        <g class="chart-item">
            <circle cx="250" cy="250" r="160" fill="transparent" stroke="#3178c6" 
                    stroke-width="4" stroke-dasharray="51.6 1005.3" 
                    stroke-dashoffset="-896.6" class="ring"/>
            <circle cx="250" cy="250" r="80" stroke="#3178c6" class="inner-pie" 
                    style="transform: rotate(231.1deg); animation: wipe-pie-3 8.0s infinite;"/>
            <text x="201.6" y="162.5" class="pie-text" fill="#ffffff" 
                  style="animation: text-fade-3 8.0s infinite;">5.5%</text>
        </g>
        
        <g class="chart-item">
            <circle cx="250" cy="250" r="160" fill="transparent" stroke="#8b949e" 
                    stroke-width="4" stroke-dasharray="49.1 1005.3" 
                    stroke-dashoffset="-952.2" class="ring"/>
            <circle cx="250" cy="250" r="80" stroke="#8b949e" class="inner-pie" 
                    style="transform: rotate(251.0deg); animation: wipe-pie-4 8.0s infinite;"/>
            <text x="233.5" y="151.4" class="pie-text" fill="#ffffff" 
                  style="animation: text-fade-4 8.0s infinite;">5.3%</text>
        </g>
        
  </g>
  
  <g id="legends">
    
        <g class="legend-item" transform="translate(520, 150)">
            <rect x="0" y="-10" width="14" height="14" rx="3" fill="#e34c26"/>
            <text x="30" y="2" fill="#f0f6fc" font-size="16" font-family="sans-serif">HTML</text>
        </g>
        
        <g class="legend-item" transform="translate(520, 190)">
            <rect x="0" y="-10" width="14" height="14" rx="3" fill="#f1e05a"/>
            <text x="30" y="2" fill="#f0f6fc" font-size="16" font-family="sans-serif">JavaScript</text>
        </g>
        
        <g class="legend-item" transform="translate(520, 230)">
            <rect x="0" y="-10" width="14" height="14" rx="3" fill="#a371f7"/>
            <text x="30" y="2" fill="#f0f6fc" font-size="16" font-family="sans-serif">CSS</text>
        </g>
        
        <g class="legend-item" transform="translate(520, 270)">
            <rect x="0" y="-10" width="14" height="14" rx="3" fill="#3178c6"/>
            <text x="30" y="2" fill="#f0f6fc" font-size="16" font-family="sans-serif">TypeScript</text>
        </g>
        
        <g class="legend-item" transform="translate(520, 310)">
            <rect x="0" y="-10" width="14" height="14" rx="3" fill="#8b949e"/>
            <text x="30" y="2" fill="#f0f6fc" font-size="16" font-family="sans-serif">Other</text>
        </g>
        
  </g>
</svg>